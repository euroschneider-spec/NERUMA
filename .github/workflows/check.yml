name: Foundation checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # Static checks, unit tests, database tests and the production build.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
  # The Playwright specs against a production build.
  # Four shards of the same run: Playwright splits the tests, every test runs in exactly one shard.
  e2e:
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04 # ubuntu-latest is 26.04, which Playwright 1.58 cannot install Chromium on
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-evidence-e2e-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  # Builds its own copy of the app with fixture settings, so it cannot share the e2e build.
  # The suite is split into groups that each start from a fresh fixture (scripts/test-workspace.mjs --group=...).
  workspace:
    name: workspace (${{ matrix.group }})
    runs-on: ubuntu-24.04 # ubuntu-latest is 26.04, which Playwright 1.58 cannot install Chromium on
    strategy:
      fail-fast: false
      matrix:
        group: [workspace, approval, two-factor, accounts]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:workspace -- --group=${{ matrix.group }}
  # One stable name for branch protection: it passes only when every job above passed.
  checks:
    if: always()
    needs: [static, e2e, workspace]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "static=${{ needs.static.result }} e2e=${{ needs.e2e.result }} workspace=${{ needs.workspace.result }}"
          test "${{ needs.static.result }}" = success
          test "${{ needs.e2e.result }}" = success
          test "${{ needs.workspace.result }}" = success
